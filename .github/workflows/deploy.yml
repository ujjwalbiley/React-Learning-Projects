name: Deploy All React Projects

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build all projects
        run: |
          mkdir -p dist

          projects=(
            "03baisc-vite-react"
            "03baiscreact"
            "05hooks-in-react"
            "06tailwindcss-props"
            "07pwd-gen"
            "bgChangerUsingReactHook"
            "contextApi"
            "react-router-crash-course"
            "themeChanger"
            "todocontextlocalStorage"
          )

          for project in "${projects[@]}"; do
            echo "Building $project"

            npm ci --prefix "$project"

            if node -e "const p=require('./$project/package.json'); process.exit(p.dependencies?.['react-scripts'] || p.devDependencies?.['react-scripts'] ? 0 : 1)"; then

              PUBLIC_URL="/React-Learning-Projects/$project" npm run build --prefix "$project"

              mkdir -p "dist/$project"
              cp -r "$project/build/." "dist/$project/"

            else

              npm run build --prefix "$project" -- --base="/React-Learning-Projects/$project/"

              mkdir -p "dist/$project"
              cp -r "$project/dist/." "dist/$project/"

            fi
          done

      - name: Upload build files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
